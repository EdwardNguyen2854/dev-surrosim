[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surrosim"
version = "0.1.0"
description = "Reproducible structural surrogate-modeling experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SurroSim contributors"}]
dependencies = []

[project.optional-dependencies]
mesh = ["gmsh>=4.13,<5"]
dev = ["pytest>=8"]

[project.scripts]
surrosim = "surrosim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
