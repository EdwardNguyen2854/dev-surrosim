name: Bug report
description: Something is broken, crashes, or produces a result you cannot reproduce.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. SurroSim claims every number is reproducible, so
        the most useful bug reports include the command that failed and the
        evidence it produced.

        Do not use this form for security problems — see
        [SECURITY.md](https://github.com/EdwardNguyen2854/surrosim/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the actual behaviour, including the full error text if there is one.
      placeholder: |
        `surrosim dataset build ...` exits with KeyError: 'thickness_mm'
        while building from data/designs_v2.csv.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands and inputs. A minimal design table beats a description.
      render: shell
      placeholder: |
        python -m venv .venv
        .venv/Scripts/python -m pip install -e ".[dev,mesh,ml,app,gnn]"
        python -m pytest -q -m "not solver"
        python -m surrosim dataset build --designs data/designs_v2.csv --runs data/runs_v2 --out data/dataset_tmp
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
      placeholder: "2.0.0 / af16864"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dataset pipeline (sampling, geometry, mesh, dataset build)
        - Solver integration (Gmsh, CalculiX, FRD parsing)
        - Scalar models (training, serving, metrics)
        - GNN field models (graph export, training, inference)
        - API service (FastAPI, jobs, endpoints)
        - Web app (React)
        - Desktop shell (Electron)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and whether CalculiX and Gmsh are installed.
      placeholder: "Windows 11, Python 3.12.10, ccx 2.23 at tools/calculix/ccx.exe, gmsh 4.13"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, `run.json`, manifest excerpts, or a report path. Remove absolute paths from your machine first.
      render: shell
    validations:
      required: false
