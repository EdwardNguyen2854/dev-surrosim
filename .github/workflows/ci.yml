name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native libraries for Gmsh
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,mesh,ml,app]'
      - run: python -m pytest -q -m "not solver"
      - run: python -m surrosim baseline
      - run: python -m surrosim sample --count 10 --seed 42 --out data/designs.csv

  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y calculix-ccx libglu1-mesa libgl1
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,mesh,ml,app]'
      - run: python -m pytest -q -m "solver"
      - name: End-to-end reproduction (quick profile)
        run: python -m surrosim reproduce --profile quick --jobs 2 --ccx ccx

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
