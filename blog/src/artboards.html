<!doctype html>

<style>
  :root{
    --paper:#FBFAF7;
    --ink:#131A20;
    --ink2:#57636D;
    --ink3:#8B959C;
    --rule:#D3D7D9;
    --grid:#EBECE8;
    --grid2:#DCDFDA;
    --blue:#1B4A6E;
    --blue2:#2C7AA6;
    --amber:#D9822B;
    --red:#B7382E;
    --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --disp:"Bahnschrift","Segoe UI Semibold","Arial Narrow",sans-serif;
    --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#8d939a;padding:40px;display:flex;flex-direction:column;gap:40px;align-items:flex-start}
  .board{
    position:relative;background:var(--paper);color:var(--ink);
    font-family:var(--sans);overflow:hidden;flex:none;
  }
  .board svg{display:block;position:absolute;left:0;top:0}
  .grid{
    position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(to right,var(--grid) 1px,transparent 1px),
      linear-gradient(to bottom,var(--grid) 1px,transparent 1px),
      linear-gradient(to right,var(--grid2) 1px,transparent 1px),
      linear-gradient(to bottom,var(--grid2) 1px,transparent 1px);
    background-size:20px 20px,20px 20px,100px 100px,100px 100px;
    opacity:.7;
  }
  .frame{position:absolute;inset:22px;border:1px solid rgba(19,26,32,.10);pointer-events:none}
  .tick{position:absolute;width:9px;height:9px;border:0 solid rgba(19,26,32,.42);pointer-events:none}
  .tick.tl{left:22px;top:22px;border-left-width:1px;border-top-width:1px}
  .tick.tr{right:22px;top:22px;border-right-width:1px;border-top-width:1px}
  .tick.bl{left:22px;bottom:22px;border-left-width:1px;border-bottom-width:1px}
  .tick.br{right:22px;bottom:22px;border-right-width:1px;border-bottom-width:1px}

  .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:1.9px;fill:var(--ink2)}
  .h2{font-family:var(--disp);font-weight:600;font-size:24px;fill:var(--ink);letter-spacing:-.2px}
  .body{font-family:var(--sans);font-size:13px;fill:var(--ink2)}
  .mono{font-family:var(--mono);fill:var(--ink2)}
  .num{font-family:var(--disp);font-weight:600;fill:var(--ink)}

  #hero{width:1280px;height:640px}
  #social{width:1200px;height:630px}
  #pipeline{width:1200px;height:640px}
  #shapes{width:1200px;height:470px}
  #speed{width:1000px;height:440px}
  #scalar{width:1000px;height:540px}
  #field{width:1000px;height:470px}
  #mesh{width:1000px;height:490px}
  #provenance{width:720px;height:560px}
</style>
</head>

<script>
/* ============================================================
   Analytic von Mises field (illustrative, not solver output).
   Plate 120 x 40 mm, hole d = 12 mm at mid-span, clamped at x = 0.
   ============================================================ */
const STOPS = [
  [0.00,[ 11, 44, 74]],
  [0.16,[ 20, 83,140]],
  [0.33,[ 46,143,168]],
  [0.50,[ 79,191,165]],
  [0.66,[242,193, 78]],
  [0.82,[224,123, 57]],
  [1.00,[183, 56, 46]]
];
function cmap(t){
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < STOPS.length; i++){
    if (t <= STOPS[i][0]){
      const a = STOPS[i-1], b = STOPS[i];
      const k = (t - a[0]) / (b[0] - a[0]);
      return a[1].map((c, j) => Math.round(c + (b[1][j] - c) * k));
    }
  }
  return STOPS[STOPS.length-1][1];
}
function fieldValue(x, y){
  const dx = x - 60, dy = y - 20;
  const d = Math.hypot(dx, dy);
  if (d < 6) return -1;
  const base = (120 - x) / 120;
  const th = Math.atan2(dy, dx);
  const ang = (1 - Math.cos(2 * th)) / 2;
  const conc = 1 + 2.05 * ang * Math.exp(-(d - 6) / 4.6);
  let s = base * conc;
  s *= 1 + 0.09 * Math.exp(-x / 9);
  return s;
}
function makeField(w, h, NB = 16){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  const band = new Int16Array(w * h);
  const MAX = 1.40;
  for (let j = 0; j < h; j++){
    const y = (j + 0.5) / h * 40;
    for (let i = 0; i < w; i++){
      const x = (i + 0.5) / w * 120;
      const s = fieldValue(x, y);
      band[j*w+i] = s < 0 ? -1 : Math.min(NB - 1, Math.floor((s / MAX) * NB));
    }
  }
  for (let j = 0; j < h; j++){
    for (let i = 0; i < w; i++){
      const k = j * w + i, o = k * 4, b = band[k];
      if (b < 0){ d[o+3] = 0; continue; }
      const rgb = cmap((b + 0.5) / NB);
      d[o] = rgb[0]; d[o+1] = rgb[1]; d[o+2] = rgb[2]; d[o+3] = 255;
      const r = i + 1 < w ? band[k+1] : b;
      const dn = j + 1 < h ? band[k+w] : b;
      if (r >= 0 && dn >= 0 && (r !== b || dn !== b)){
        d[o]   = Math.min(255, rgb[0] + 40);
        d[o+1] = Math.min(255, rgb[1] + 40);
        d[o+2] = Math.min(255, rgb[2] + 40);
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL('image/png');
}
const FIELD = makeField(1800, 600);

/* ---------- helpers ---------- */
function holePath(cx, cy, r){
  return `M${cx-r},${cy} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0`;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function T(cls, x, y, s, opts = {}){
  const a = [`class="${cls}"`, `x="${x}"`, `y="${y}"`];
  if (opts.a) a.push(`text-anchor="${opts.a}"`);
  if (opts.size) a.push(`font-size="${opts.size}"`);
  if (opts.ls) a.push(`letter-spacing="${opts.ls}"`);
  if (opts.fill) a.push(`style="fill:${opts.fill}"`);
  return `<text ${a.join(' ')}>${esc(s)}</text>`;
}
const hatchDef = (id, size = 6, sw = 1.1) => `
  <pattern id="${id}" width="${size}" height="${size}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="${size}" stroke="#131A20" stroke-width="${sw}" opacity=".5"/>
  </pattern>`;
const loadSym = (x, y, r = 11) => `
  <circle cx="${x}" cy="${y}" r="${r}" fill="#FBFAF7" stroke="#B7382E" stroke-width="1.8"/>
  <path d="M${x-r*0.62},${y-r*0.62} L${x+r*0.62},${y+r*0.62} M${x+r*0.62},${y-r*0.62} L${x-r*0.62},${y+r*0.62}"
        stroke="#B7382E" stroke-width="1.8"/>`;

/* ============================================================
   1. HERO — perforated cantilever, plane view
   ============================================================ */
(function hero(){
  const S = 7.4, LEFT = 92, TOP = 48;
  const OX = LEFT + 12 * S, OY = TOP + 12 * S;
  const bx = (x) => OX + x * S;
  const by = (y) => OY + y * S;

  const drawing = `
    <defs>
      ${hatchDef('hz', 1.8, .11)}
      <clipPath id="pclip"><path d="M0,0 H120 V40 H0 Z ${holePath(60,20,6)}" clip-rule="evenodd"/></clipPath>
      <pattern id="tmesh" width="4" height="3.464" patternUnits="userSpaceOnUse">
        <path d="M0,0 L2,3.464 L4,0 M0,3.464 L2,0 L4,3.464" fill="none"
              stroke="#0B1A24" stroke-width=".045"/>
        <line x1="0" y1="0" x2="4" y2="0" stroke="#0B1A24" stroke-width=".045"/>
      </pattern>
      <linearGradient id="rb" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0B2E4A"/><stop offset=".16" stop-color="#14538C"/>
        <stop offset=".33" stop-color="#2E8FA8"/><stop offset=".5" stop-color="#4FBFA5"/>
        <stop offset=".66" stop-color="#F2C14E"/><stop offset=".82" stop-color="#E07B39"/>
        <stop offset="1" stop-color="#B7382E"/>
      </linearGradient>
    </defs>

    <g clip-path="url(#pclip)">
      <image x="0" y="0" width="120" height="40" preserveAspectRatio="none" href="${FIELD}"/>
      <rect x="0" y="0" width="120" height="40" fill="url(#tmesh)" opacity=".32"/>
    </g>
    <path d="M0,0 H120 V40 H0 Z ${holePath(60,20,6)}" fill="none" stroke="#0E1A24"
          stroke-width=".23" fill-rule="evenodd"/>

    <clipPath id="clampClip"><rect x="-7" y="-2" width="7" height="44"/></clipPath>
    <g clip-path="url(#clampClip)">
      ${Array.from({ length: 30 }, (_, i) => {
        const y = -10 + i * 1.7;
        return `<line x1="-8" y1="${y.toFixed(2)}" x2="1" y2="${(y + 9).toFixed(2)}"
                      stroke="#131A20" stroke-width=".1"/>`;
      }).join('')}
    </g>
    <line x1="0" y1="-2" x2="0" y2="42" stroke="#0E1A24" stroke-width=".32"/>

    <circle cx="60" cy="20" r="9" fill="none" stroke="#FBFAF7" stroke-width=".16"
            stroke-dasharray=".42 .38"/>
    <path d="M60,11 L60,2.5 L74,-5" fill="none" stroke="#131A20" stroke-width=".12"/>
    <circle cx="60" cy="11" r=".85" fill="#131A20"/>
    <path d="M60,29 L60,44" fill="none" stroke="#131A20" stroke-width=".12"/>
    <circle cx="60" cy="29" r=".8" fill="#131A20"/>
    <path d="M120.4,20 L124.1,20" fill="none" stroke="#B7382E" stroke-width=".12" stroke-dasharray=".45 .4"/>

    <line x1="0" y1="42" x2="0" y2="50.6" stroke="#8B959C" stroke-width=".11"/>
    <line x1="120" y1="42" x2="120" y2="50.6" stroke="#8B959C" stroke-width=".11"/>
    <line x1="0" y1="49" x2="120" y2="49" stroke="#57636D" stroke-width=".11"/>
    <path d="M0,49 l0.62,-0.24 v0.48 Z" fill="#57636D"/>
    <path d="M120,49 l-0.62,-0.24 v0.48 Z" fill="#57636D"/>

    <line x1="-10.4" y1="0" x2="-4" y2="0" stroke="#8B959C" stroke-width=".11"/>
    <line x1="-10.4" y1="40" x2="-4" y2="40" stroke="#8B959C" stroke-width=".11"/>
    <line x1="-9.4" y1="0" x2="-9.4" y2="40" stroke="#57636D" stroke-width=".11"/>
    <path d="M-9.4,0 l-0.24,0.62 h0.48 Z" fill="#57636D"/>
    <path d="M-9.4,40 l-0.24,-0.62 h0.48 Z" fill="#57636D"/>

    <rect x="0" y="54" width="34" height="3.4" fill="url(#rb)" stroke="#131A20" stroke-width=".14"/>
  `;

  document.getElementById('heroSvg').innerHTML = `
    <g transform="translate(${OX},${OY}) scale(${S})">${drawing}</g>

    ${T('kicker', 92, 78, 'VON MISES STRESS · PERFORATED CANTILEVER', {ls:'2'})}
    <line x1="92" y1="90" x2="392" y2="90" stroke="#131A20" stroke-width="1.2" opacity=".5"/>
    ${T('mono', 1188, 78, 'FIG. 00', {a:'end', size:'10.5', ls:'2', fill:'#8B959C'})}

    ${T('mono', bx(0) - 8, by(-4.6), 'CLAMPED', {a:'end', size:'9.5', ls:'1.6', fill:'#8B959C'})}
    ${`<text class="mono" x="${bx(-9.4) - 15}" y="${by(20)}" font-size="11.5" fill="#57636D"
        text-anchor="middle" transform="rotate(-90 ${bx(-9.4) - 15} ${by(20)})">40 mm</text>`}
    ${T('mono', bx(60), by(49) + 19, '120 mm', {a:'middle', size:'11.5', fill:'#57636D'})}
    ${T('mono', bx(62.5), by(45.2) + 4, '⌀ 12 mm', {size:'11', fill:'#57636D'})}

    ${T('mono', bx(75), by(-6) - 8, 'REGION OF INTEREST · 1.5 d', {size:'9.5', ls:'1.4', fill:'#8B959C'})}
    ${T('num', bx(75), by(-6) + 12, '270.8 MPa', {size:'16'})}
    ${T('mono', bx(75), by(-6) + 27, 'peak von Mises in the hole region', {size:'9.5', fill:'#8B959C'})}

    ${loadSym(bx(126), by(20), 12)}
    ${T('num', bx(130), by(20) - 4, 'F = 500 N', {size:'15'})}
    ${T('mono', bx(130), by(20) + 10, 'total force, −Z', {size:'9.5', fill:'#8B959C'})}

    ${T('mono', bx(0), by(60), '0', {size:'9', fill:'#8B959C'})}
    ${T('mono', bx(11.33), by(60), '90', {a:'middle', size:'9', fill:'#8B959C'})}
    ${T('mono', bx(22.67), by(60), '180', {a:'middle', size:'9', fill:'#8B959C'})}
    ${T('mono', bx(34), by(60), '270', {a:'end', size:'9', fill:'#8B959C'})}
    ${T('mono', bx(38), by(60), 'σ vm, MPa', {size:'9.5', ls:'1.2', fill:'#57636D'})}
    ${T('mono', 1188, by(60), 'C3D10 · hole-graded 1.2 mm · steel, E 210 GPa · ν 0.3',
         {a:'end', size:'9.5', fill:'#8B959C'})}
  `;
})();

/* ============================================================
   2. SOCIAL CARD
   ============================================================ */
(function social(){
  document.getElementById('socialHtml').innerHTML = `
    <div style="position:absolute;left:68px;top:74px">
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:2.4px;color:var(--ink2)">
        SURROGATE MODELS · STRUCTURAL FEA</div>
      <div style="font-family:var(--disp);font-weight:600;font-size:64px;line-height:1.02;
                  letter-spacing:-1.4px;margin-top:26px">
        The solver,<br>in microseconds<span style="color:var(--amber)">.</span></div>
      <div style="font-size:17px;line-height:1.55;color:var(--ink2);margin-top:26px;max-width:540px">
        SurroSim predicts stress and displacement for parametric cantilevers.<br>
        Gated, validated, and traceable back to the mesh.</div>
    </div>
    <div style="position:absolute;left:68px;bottom:66px;display:flex;width:540px;
                border-top:1px solid var(--rule);padding-top:18px">
      <div style="flex:1">
        <div style="font-family:var(--disp);font-weight:600;font-size:32px">1.85%</div>
        <div style="font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--ink3);margin-top:7px">
          MEDIAN TEST ERROR</div>
      </div>
      <div style="flex:1;border-left:1px solid var(--rule);padding-left:24px">
        <div style="font-family:var(--disp);font-weight:600;font-size:32px">10⁶×</div>
        <div style="font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--ink3);margin-top:7px">
          FASTER THAN FEA</div>
      </div>
      <div style="flex:1;border-left:1px solid var(--rule);padding-left:24px">
        <div style="font-family:var(--disp);font-weight:600;font-size:32px">644</div>
        <div style="font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--ink3);margin-top:7px">
          GATED CASES</div>
      </div>
    </div>`;

  const PS = 3.6, PX = 646, PY = 232;
  document.getElementById('socialSvg').innerHTML = `
    <defs><clipPath id="sc"><path d="M0,0 H140 V40 H0 Z ${holePath(70,20,6)}" clip-rule="evenodd"/></clipPath></defs>
    <g transform="translate(${PX},${PY}) scale(${PS})">
      <g clip-path="url(#sc)">
        <image x="0" y="0" width="140" height="40" preserveAspectRatio="none" href="${FIELD}"/>
      </g>
      <path d="M0,0 H140 V40 H0 Z ${holePath(70,20,6)}" fill="none" stroke="#0E1A24"
            stroke-width=".13" fill-rule="evenodd"/>
      <line x1="-1.1" y1="-2" x2="-1.1" y2="42" stroke="#0E1A24" stroke-width=".3"/>
    </g>
    <text class="mono" x="${PX}" y="${PY + 40 * PS + 34}" font-size="9" letter-spacing="1.8" fill="#8B959C">
      VON MISES σ · PLANE VIEW · CANTILEVER 120 × 40 mm</text>
  `;
})();

/* ============================================================
   3. PIPELINE
   ============================================================ */
(function pipeline(){
  const stages = [
    {n:'01', t:'SAMPLE',  d:['Shape registry +','Sobol / LHS'], a:'designs_v2.csv',
     icon:`<rect x="4" y="6" width="24" height="26" rx="1.5"/><line x1="4" y1="13" x2="28" y2="13"/>
           <line x1="10" y1="19" x2="22" y2="19"/><line x1="10" y1="25" x2="22" y2="25"/>`},
    {n:'02', t:'MESH',    d:['Gmsh OCC tetrahedra,','quadratic, riser-graded'], a:'.msh + quality',
     icon:`<path d="M16,4 L28,26 L4,26 Z"/><path d="M16,4 L11,18 L21,18 Z"/><line x1="11" y1="18" x2="4" y2="26"/>
           <line x1="21" y1="18" x2="28" y2="26"/>`},
    {n:'03', t:'SOLVE',   d:['CalculiX deck,','total-force load'], a:'.frd fields',
     icon:`<circle cx="16" cy="16" r="11"/><path d="M16,9 L16,17 L22,21"/>`},
    {n:'04', t:'GATE',    d:['Six label gates,','failures quarantined'], a:'dataset_v2',
     icon:`<path d="M4,5 H28 L18,17 V27 L14,23 V17 Z"/><line x1="9" y1="10" x2="23" y2="10"/>`},
    {n:'05', t:'TRAIN',   d:['GP + MLP ensemble,','MeshGraphNet'], a:'models/ + metrics',
     icon:`<circle cx="7" cy="8" r="3"/><circle cx="7" cy="24" r="3"/><circle cx="16" cy="16" r="3"/>
           <circle cx="26" cy="7" r="3"/><circle cx="26" cy="25" r="3"/>
           <line x1="10" y1="9" x2="13" y2="14"/><line x1="10" y1="23" x2="13" y2="18"/>
           <line x1="19" y1="15" x2="23" y2="9"/><line x1="19" y1="17" x2="23" y2="23"/>`},
    {n:'06', t:'SERVE',   d:['FastAPI + jobs,','confidence / OOD'], a:'web app + desktop',
     icon:`<rect x="3" y="6" width="26" height="20" rx="2"/><line x1="3" y1="12" x2="29" y2="12"/>
           <circle cx="6.5" cy="9" r=".9" fill="currentColor"/><circle cx="10" cy="9" r=".9" fill="currentColor"/>
           <path d="M8,17 L12,21 L20,16"/>`}
  ];
  const cw = 164, gap = 21, x0 = 56, top = 148;
  let out = `
    ${T('kicker', 56, 74, 'THE PIPELINE · SIMULATION → DATASET → MODEL → SERVICE')}
    ${T('h2', 56, 112, 'Six stages, every one of them auditable', {size:'27'})}`;

  stages.forEach((s, i) => {
    const x = x0 + i * (cw + gap);
    out += `<g transform="translate(${x},${top})">

(function speed(){
  const x0 = 110, x1 = 900, y = 230;

  for (let e = lo; e <= 2; e++){
    const px = X(Math.pow(10, e));
    const major = labels[e] !== undefined;
    ticks += `<line x1="${px}" y1="${y - (major ? 22 : 10)}" x2="${px}" y2="${y + 22}"
                    stroke="#C9CED1" stroke-width="${major ? 1.2 : 1}"/>
              <circle cx="${px}" cy="${y}" r="${major ? 3.2 : 2}" fill="${major ? '#57636D' : '#AEB5BA'}"/>`;

  }

  const feaX = X(10.05), surX = X(1e-5), midX = (surX + feaX) / 2;
  document.getElementById('speedSvg').innerHTML = `
    ${T('kicker', 56, 66, 'COST PER EVALUATION · LOG SCALE, SECONDS')}
    ${T('h2', 56, 102, 'Ten seconds of solver, or ten microseconds', {size:'26'})}

    <line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#57636D" stroke-width="1.4"/>
    ${ticks}

    <line x1="${surX}" y1="${y}" x2="${surX}" y2="${y - 66}" stroke="#1B4A6E" stroke-width="1.6"/>

    <path d="M${surX},${y + 66} L${surX},${y + 80} L${feaX},${y + 80} L${feaX},${y + 66}"
          fill="none" stroke="#131A20" stroke-width="1.1"/>

    ${T('mono', 944, y + 145, 'source: reports/v0.4', {a:'end', size:'9.5', fill:'#8B959C'})}
  `;
})();
